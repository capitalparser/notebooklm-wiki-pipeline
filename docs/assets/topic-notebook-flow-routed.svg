<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">Topic notebook routing flow</title>
  <desc id="desc">Flow diagram showing Drive PDFs routed through a topic registry to reusable NotebookLM notebooks or isolated notebooks, then into Obsidian wiki notes.</desc>
  <!-- README diagram guardrail: SVG text does not auto-wrap. Keep labels manually split and route arrows edge-to-edge without crossing boxes, labels, or tables. -->
  <defs>
    <marker id="arrow" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1600" height="860" rx="28" fill="#f8fafc"/>

  <text x="72" y="100" fill="#0f172a" font-family="Arial, sans-serif" font-size="44" font-weight="700">Topic-first NotebookLM routing</text>
  <text x="72" y="152" fill="#475569" font-family="Arial, sans-serif" font-size="28">Route related PDFs into curated topic notebooks; keep unknown PDFs isolated.</text>

  <rect x="72" y="300" width="304" height="144" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="110" y="360" fill="#0f172a" font-family="Arial, sans-serif" font-size="30" font-weight="700">Drive PDF</text>
  <text x="110" y="404" fill="#64748b" font-family="Arial, sans-serif" font-size="24">URL or file ID only</text>

  <path d="M 404 372 L 520 372" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <rect x="548" y="280" width="380" height="184" rx="16" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="588" y="350" fill="#155e75" font-family="Arial, sans-serif" font-size="30" font-weight="700">Topic registry</text>
  <text x="588" y="396" fill="#0e7490" font-family="Arial, sans-serif" font-size="24">explicit --topic</text>
  <text x="588" y="436" fill="#0e7490" font-family="Arial, sans-serif" font-size="24">keyword fallback + dedup</text>

  <path d="M 960 334 L 1068 250" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 960 410 L 1068 526" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <rect x="1068" y="154" width="430" height="168" rx="16" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="1112" y="216" fill="#166534" font-family="Arial, sans-serif" font-size="30" font-weight="700">Reuse topic notebook</text>
  <text x="1112" y="262" fill="#15803d" font-family="Arial, sans-serif" font-size="24">Audit, Stablecoin, Korea Market</text>

  <rect x="1068" y="454" width="430" height="168" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="1112" y="516" fill="#9a3412" font-family="Arial, sans-serif" font-size="30" font-weight="700">Create isolated notebook</text>
  <text x="1112" y="562" fill="#c2410c" font-family="Arial, sans-serif" font-size="24">Unknown or unrelated PDFs</text>

  <path d="M 1498 238 L 1534 238 L 1534 656 L 1240 656" stroke="#94a3b8" stroke-width="4" stroke-dasharray="12 12" fill="none"/>
  <path d="M 1498 538 L 1534 538 L 1534 656 L 1240 656" stroke="#94a3b8" stroke-width="4" stroke-dasharray="12 12" fill="none"/>
  <path d="M 1240 656 L 836 656 L 836 682" stroke="#94a3b8" stroke-width="4" fill="none" marker-end="url(#arrow-soft)"/>

  <rect x="538" y="690" width="596" height="108" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="588" y="738" fill="#0f172a" font-family="Arial, sans-serif" font-size="28" font-weight="700">Obsidian wiki note</text>
  <text x="588" y="778" fill="#0f172a" font-family="Arial, sans-serif" font-size="26" font-weight="700">with notebook_id, topic, source status</text>
</svg>
