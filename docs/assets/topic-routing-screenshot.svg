<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">NotebookLM topic routing terminal screenshot</title>
  <desc id="desc">A terminal-style screenshot showing a Drive PDF routed to an audit accounting topic notebook.</desc>
  <rect width="1120" height="640" rx="18" fill="#111827"/>
  <rect x="28" y="28" width="1064" height="584" rx="14" fill="#0b1220" stroke="#334155"/>
  <circle cx="58" cy="58" r="7" fill="#ef4444"/>
  <circle cx="82" cy="58" r="7" fill="#f59e0b"/>
  <circle cx="106" cy="58" r="7" fill="#22c55e"/>
  <text x="138" y="64" fill="#94a3b8" font-family="Menlo, Consolas, monospace" font-size="16">notebooklm-wiki-pipeline</text>

  <text x="58" y="116" fill="#e5e7eb" font-family="Menlo, Consolas, monospace" font-size="18">$ python3 scripts/notebook_registry.py \</text>
  <text x="82" y="148" fill="#e5e7eb" font-family="Menlo, Consolas, monospace" font-size="18">"https://drive.google.com/file/d/YOUR_FILE_ID/view" \</text>
  <text x="82" y="180" fill="#e5e7eb" font-family="Menlo, Consolas, monospace" font-size="18">--title "K-IFRS 1109 금융상품" --topic audit-accounting</text>

  <rect x="58" y="220" width="1004" height="336" rx="10" fill="#111827" stroke="#1f2937"/>
  <text x="86" y="264" fill="#a7f3d0" font-family="Menlo, Consolas, monospace" font-size="18">{</text>
  <text x="112" y="296" fill="#c4b5fd" font-family="Menlo, Consolas, monospace" font-size="18">"topic_id"</text>
  <text x="260" y="296" fill="#e5e7eb" font-family="Menlo, Consolas, monospace" font-size="18">: </text>
  <text x="284" y="296" fill="#fde68a" font-family="Menlo, Consolas, monospace" font-size="18">"audit-accounting"</text>
  <text x="112" y="328" fill="#c4b5fd" font-family="Menlo, Consolas, monospace" font-size="18">"notebook_action"</text>
  <text x="320" y="328" fill="#e5e7eb" font-family="Menlo, Consolas, monospace" font-size="18">: </text>
  <text x="344" y="328" fill="#fde68a" font-family="Menlo, Consolas, monospace" font-size="18">"reuse_topic_notebook"</text>
  <text x="112" y="360" fill="#c4b5fd" font-family="Menlo, Consolas, monospace" font-size="18">"source_action"</text>
  <text x="288" y="360" fill="#e5e7eb" font-family="Menlo, Consolas, monospace" font-size="18">: </text>
  <text x="312" y="360" fill="#fde68a" font-family="Menlo, Consolas, monospace" font-size="18">"skip_existing_source"</text>
  <text x="112" y="392" fill="#c4b5fd" font-family="Menlo, Consolas, monospace" font-size="18">"routing_reason"</text>
  <text x="304" y="392" fill="#e5e7eb" font-family="Menlo, Consolas, monospace" font-size="18">: </text>
  <text x="328" y="392" fill="#fde68a" font-family="Menlo, Consolas, monospace" font-size="18">"explicit_topic:audit-accounting"</text>
  <text x="86" y="424" fill="#a7f3d0" font-family="Menlo, Consolas, monospace" font-size="18">}</text>

  <rect x="86" y="472" width="560" height="50" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="112" y="504" fill="#d1fae5" font-family="Arial, sans-serif" font-size="18">Result: reuse the topic NotebookLM notebook, avoid duplicate source add.</text>
</svg>
